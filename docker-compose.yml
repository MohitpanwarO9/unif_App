services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unified_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-unified_cloud_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unified_cloud_dev} -d ${POSTGRES_DB:-unified_cloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./apps/server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-unified_cloud_dev}:${POSTGRES_PASSWORD:-change_this_local_password}@db:5432/${POSTGRES_DB:-unified_cloud}?schema=public
      HOST: 0.0.0.0
      PORT: 4000
      RUNNING_IN_DOCKER: "true"
      NODE_ENV: development
      GOOGLE_OAUTH_CLIENT_FILE: /run/secrets/google-oauth-client.json
    volumes:
      - ./apps/server/secrets/google-oauth-client.json:/run/secrets/google-oauth-client.json:ro
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-4000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - server

volumes:
  postgres_data:
